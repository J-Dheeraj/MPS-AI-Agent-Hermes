# Hermes volunteer policy profile (offline, production-safe template).
# Constituent-facing interactions belong in the authenticated nanoClaw client.

model:
  provider: ollama
  name: llama3.1:8b
  base_url: http://127.0.0.1:11434

# Third-party messaging is deliberately disabled. Do not add a Telegram token
# to a profile that may process constituent or case information.
gateway:
  telegram:
    token: ""
    allowed_users: []
    allow_groups: false

skills:
  evolution:
    enabled: false
    auto_capture: false
  curator:
    enabled: false

# CRM access is not permitted from Hermes. All case operations go through
# nanoClaw's authenticated, audited workflow service.
mcp:
  servers: {}

# Conversational memory is disabled to prevent cross-case persistence.
memory:
  enabled: false

logging:
  level: info
  file: ~/.hermes/profiles/mps-volunteers/logs/hermes.log
