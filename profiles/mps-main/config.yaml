# Hermes profile config — mps-main (OFFLINE SKILL ENGINE MODE)
# Place at: ~/.hermes/profiles/mps-main/config.yaml
#
# This profile runs in OFFLINE mode — no live Telegram connection.
# It operates as a weekly skill improvement engine for nanoClaw.
# See OFFLINE-MODE.md for the full integration workflow.
#
# DO NOT add bot tokens or CRM access to this config.
# Constituent data must never enter this system.

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------

model:
  provider: anthropic
  name: claude-sonnet-4-5   # claude-opus-4 for highest accuracy on complex cases
  # Hermes enforces a minimum of 64,000 context tokens.
  # Both claude-sonnet-4-5 and claude-opus-4 exceed this requirement.

# ---------------------------------------------------------------------------
# Messaging gateway — Telegram
# ---------------------------------------------------------------------------

gateway:
  telegram:
    token: ""                             # OFFLINE MODE — no bot token
    allowed_users: []                     # OFFLINE MODE — no live users
    allow_groups: false

# ---------------------------------------------------------------------------
# Skills — self-improvement
# ---------------------------------------------------------------------------

skills:
  evolution:
    enabled: true              # GEPA self-improvement — core purpose of this profile
    auto_capture: false        # OFFLINE MODE — no live sessions to auto-capture from
    trigger_tool_calls: 5      # Threshold for pattern extraction from feedback input
  curator:
    enabled: true              # Consolidates + prunes skill library every 7 days
    interval_days: 7

# ---------------------------------------------------------------------------
# MCP servers — CRM bridge
# ---------------------------------------------------------------------------

mcp:
  servers: {}
  # OFFLINE MODE — no CRM access.
  # Constituent case data must never enter this system.
  # CRM tools are available in nanoClaw (production) only.

# ---------------------------------------------------------------------------
# Memory settings
# ---------------------------------------------------------------------------

memory:
  enabled: true
  backend: local          # Stored in ~/.hermes/profiles/mps-main/memories/

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

logging:
  level: info
  file: ~/.hermes/profiles/mps-main/logs/hermes.log
