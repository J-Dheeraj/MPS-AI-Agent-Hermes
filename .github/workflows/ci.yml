name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governed-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          # requirements-crm.txt is the only Python dependency manifest in the
          # repo root; without this path setup-python cannot resolve a pip cache
          # key (it only matches **/requirements.txt by default) and the job
          # fails at the setup-python step.
          cache-dependency-path: requirements-crm.txt
      - run: python -m pip install --disable-pip-version-check fastmcp==3.4.2 python-dotenv==1.1.1 pytest==8.2.2 cryptography>=42
      - run: python -m pip check
      - run: python -m compileall -q hermes.py promote_approved.py crm_approval.py mcp-crm-server.py policy_keys.py
      - run: python -m pytest -q

  review-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hermes-review-app/package-lock.json
      - run: npm ci
        working-directory: hermes-review-app
      - run: npm run build
        working-directory: hermes-review-app
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo test --locked
        working-directory: hermes-review-app/src-tauri

  dependency-scan:
    name: Dependency and SBOM scan (V4-I2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements-crm.txt --strict --format json -o pip-audit.json
      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit.json
      - name: Generate SBOM and scan (syft + grype)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.0.0
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.74.0
          syft dir:. --output cyclonedx-json=sbom.json
          grype sbom:sbom.json --fail-on high --output json > grype-results.json
      - name: Upload SBOM and scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-grype
          path: |
            sbom.json
            grype-results.json

  secret-scan:
    name: Secret scanning (V4-I2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
