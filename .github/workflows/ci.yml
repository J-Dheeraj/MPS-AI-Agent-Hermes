name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governed-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          # requirements-crm.txt is the only Python dependency manifest in the
          # repo root; without this path setup-python cannot resolve a pip cache
          # key (it only matches **/requirements.txt by default) and the job
          # fails at the setup-python step.
          cache-dependency-path: requirements-crm.txt
      # v7 I#1: install the DECLARED production set so CI tests what ships
      # (requirements-crm.txt pins python-dotenv==1.2.2, not the old 1.1.1).
      # pytest is the only test-only addition.
      - run: python -m pip install --disable-pip-version-check -r requirements-crm.txt pytest==8.2.2
      - run: python -m pip check
      - run: python -m compileall -q hermes.py promote_approved.py crm_approval.py mcp-crm-server.py policy_keys.py
      - run: python -m pytest -q

  review-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hermes-review-app/package-lock.json
      - run: npm ci
        working-directory: hermes-review-app
      - run: npm run build
        working-directory: hermes-review-app
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo test --locked
        working-directory: hermes-review-app/src-tauri

  dependency-scan:
    name: Dependency and SBOM scan (V4-I2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements-crm.txt --strict --format json -o pip-audit.json
      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-results
          path: pip-audit.json
      - name: Generate SBOM and scan (syft + grype)
        run: |
          # v9: download the pinned installer and verify its sha256 before running
          # it (no unchecked curl|sh). Pinned to the v1.0.0 release script.
          curl -sSfL -o /tmp/syft-install.sh https://raw.githubusercontent.com/anchore/syft/v1.0.0/install.sh
          echo "39e6c5df8895b91e1b925af3f2ab1571c99140e88cfa472bd64bba5637319e67  /tmp/syft-install.sh" | sha256sum -c -
          sh /tmp/syft-install.sh -b /usr/local/bin v1.0.0
          # v9: download the pinned installer and verify its sha256 before running
          # it (no unchecked curl|sh). Pinned to the v0.114.0 release script.
          curl -sSfL -o /tmp/grype-install.sh https://raw.githubusercontent.com/anchore/grype/v0.114.0/install.sh
          echo "8646f06a90b10ca64992c1809b4aa00c44e30b4f551f63c309b0b0ab66873556  /tmp/grype-install.sh" | sha256sum -c -
          sh /tmp/grype-install.sh -b /usr/local/bin v0.114.0
          syft dir:. --output cyclonedx-json=sbom.json
          # v7 C4: fail closed. Require a fresh DB; do not disable age validation
          # or ignore db-update failure (a stale DB must not produce a green scan).
          # grype >=0.80 uses the maintained DB v6 feed (the schema-v5 feed used
          # by <=0.77 is frozen ~14 weeks stale and always fails the age check).
          grype db update
          grype sbom:sbom.json --fail-on high --output json > grype-results.json
      - name: Upload SBOM and scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-grype
          path: |
            sbom.json
            grype-results.json

  secret-scan:
    name: Secret scanning (V4-I2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
