#   - owner: repo maintainer (J-Dheeraj)
#   - accepted: 2026-06-21
#   - expires: 2026-09-19  (90 days; re-review or remove by this date)
#   - follow-up: spawned task "Bump vite to >=6.4.3 in hermes-review-app" —
#     remove this ignore once vite is on >=6.4.3.
ignore:
  - vulnerability: GHSA-fx2h-pf6j-xcff
